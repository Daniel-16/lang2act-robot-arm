[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lang2act"
version = "0.1.0"
description = "Natural-language tabletop manipulation with a Franka Panda arm in MuJoCo: the LLM decides what, deterministic code decides how, the simulator decides whether it worked."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel Toba" }]
license = { text = "Apache-2.0" }
dependencies = [
    "mujoco>=3.2",
    "mink>=0.0.5",
    "numpy>=1.24",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=7.4"]

[project.scripts]
lang2act = "lang2act.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
