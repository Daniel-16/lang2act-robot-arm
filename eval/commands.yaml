# --- Relational (6) ------------------------------------------------------- #
- id: rel_01
  command: move the cube nearest the bowl to the left of the green one
  category: relational
  seed: 15
  goal: {type: relative, object: "nearest_to:bowl", relation: left_of, reference: green_cube}

- id: rel_02
  command: put the blue cube to the left of the green cube
  category: relational
  seed: 16
  goal: {type: relative, object: blue_cube, relation: left_of, reference: green_cube}

- id: rel_03
  command: put the red cube to the right of the blue cube
  category: relational
  seed: 17
  goal: {type: relative, object: red_cube, relation: right_of, reference: blue_cube}

- id: rel_04
  command: place the green cube behind the red cube
  category: relational
  seed: 18
  goal: {type: relative, object: green_cube, relation: behind, reference: red_cube}

- id: rel_05
  command: put the blue cube in front of the red cube
  category: relational
  seed: 19
  goal: {type: relative, object: blue_cube, relation: in_front_of, reference: red_cube}

- id: rel_06
  command: move the cube farthest from the bowl to the left of the red cube
  category: relational
  # Seed chosen so the farthest cube is never the red one on any of the three
  # seeds -- otherwise the goal would read "put the red cube left of itself".
  seed: 34
  goal: {type: relative, object: "farthest_from:bowl", relation: left_of, reference: red_cube}

