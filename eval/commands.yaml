# Lang2Act evaluation set -- 30 commands, frozen before any prompt tuning.
#
# Freeze this file. Tuning the prompt against commands you also score on is how
# you end up reporting a number that means nothing. If a command turns out to be
# badly worded, note it in the README's limitations instead of editing it.
#
# Each entry has:
#   id        stable identifier, used in the log filenames
#   command   exactly what gets typed
#   category  simple | paraphrase | relational | multi | ambiguous | infeasible
#   seed      scene seed; the eval runs seed, seed+1, seed+2
#   goal      machine-checkable success condition (see lang2act/eval.py)
#
# Object specifiers in a goal may be a literal name (red_cube) or, resolved
# against the *initial* layout, "nearest_to:bowl" / "farthest_from:bowl".

# --- Simple placement (8) -------------------------------------------------- #
- id: simple_01
  command: put the red cube in the bowl
  category: simple
  seed: 1
  goal: {type: in_region, object: red_cube, region: bowl}

- id: simple_02
  command: put the green cube in the bowl
  category: simple
  seed: 2
  goal: {type: in_region, object: green_cube, region: bowl}

- id: simple_03
  command: put the blue cube in the bowl
  category: simple
  seed: 3
  goal: {type: in_region, object: blue_cube, region: bowl}

- id: simple_04
  command: place the red cube into the bowl
  category: simple
  seed: 4
  goal: {type: in_region, object: red_cube, region: bowl}

- id: simple_05
  command: pick up the green cube and put it in the bowl
  category: simple
  seed: 5
  goal: {type: in_region, object: green_cube, region: bowl}

- id: simple_06
  command: put the blue cube inside the bowl
  category: simple
  seed: 6
  goal: {type: in_region, object: blue_cube, region: bowl}

- id: simple_07
  command: move the red cube to the bowl
  category: simple
  seed: 7
  goal: {type: in_region, object: red_cube, region: bowl}

- id: simple_08
  command: put the green cube in the bowl please
  category: simple
  seed: 8
  goal: {type: in_region, object: green_cube, region: bowl}

